<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>発注一覧</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

  <h1>発注一覧</h1>

  <table border="1">
    <thead>
      <tr>
        <th>商品名</th>
        <th>店舗名</th>
        <th>数量</th>
        <th>発注日</th>
        <th>ステータス</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="order : ${orders}">
        <td th:text="${order.product.name}">商品名</td>
        <td th:text="${order.store != null ? order.store.name : '未設定'}">店舗名</td>
        <td th:text="${order.quantity}">数量</td>
        <td th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd')}">発注日</td>
        <td th:text="${order.status}">ステータス</td>
      </tr>
    </tbody>
  </table>

</body>
</html>

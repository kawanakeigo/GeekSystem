<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>管理者フォーム</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <h1 th:text="${adminForm != null and adminForm.id != null} ? '管理者編集' : '新規管理者登録'"></h1>
  <form th:action="${adminForm.id} != null ? @{/admins/{id}/edit(id=${adminForm.id})} : @{/admins/new}"
        th:object="${adminForm}" method="post">
    <input type="hidden" th:field="*{id}" />
	
    <label>姓：</label>
    <input type="text" th:field="*{lastName}" required/>
	<span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" style="color: red"></span>

	<label>名：</label>
	<input type="text" th:field="*{firstName}" required/>
	<span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" style="color: red"></span>
	
    <label>役職：</label>
    <select th:field="*{roleId}" required>
      <option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.name}"></option>
    </select>
	
	<label>店舗：</label>
	<select th:field="*{storeId}" required>
	  <option value="">選択してください</option>
	  <option th:each="store : ${stores}" th:value="${store.id}" th:text="${store.name}"></option>
	</select>
	
	<label>権限：</label>
	<select th:field="*{authoritiesId}" required>
	  <option value="">選択してください</option>
	  <option th:each="auth : ${authorities}" th:value="${auth.id}" th:text="${auth.name}"></option>
	</select>
	
    <label>メールアドレス：</label>
    <input type="email" th:field="*{email}" required/>
	<span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color: red"></span>
	
	<label>電話番号：</label>
	<input type="text" th:field="*{phonenumber}" required/>
	<span th:if="${#fields.hasErrors('phonenumber')}" th:errors="*{phonenumber}" style="color: red"></span>
	
	<label>パスワード：</label>
	<input type="password" th:field="*{password}" required/>
	<span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color: red"></span>
	
    <button type="submit">保存</button>
  </form>
  <li><a th:href="@{/}">Topページへ</a></li>
</body>
</html>

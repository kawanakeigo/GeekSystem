<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>商品一覧</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <h1>商品一覧</h1>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>商品名</th>
                <th>価格</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.id}">ID</td>
                <td th:text="${product.name}">商品名</td>
                <td th:text="${product.price}">価格</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
